<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>Кто ты сегодня? 🎰</title>
    <!-- Tailwind CSS for modern responsive layout -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,800;0,900;1,900&display=swap');

        body {
            font-family: 'Montserrat', sans-serif;
            background: radial-gradient(circle at center, #111827 0%, #030712 100%);
            color: #ffffff;
            touch-action: manipulation;
        }

        /* Neon Glow Effects */
        .neon-glow {
            box-shadow: 0 0 35px rgba(236, 72, 153, 0.35), inset 0 0 15px rgba(0, 0, 0, 0.6);
        }

        .neon-text-title {
            text-shadow: 0 0 15px rgba(251, 191, 36, 0.6), 0 0 30px rgba(236, 72, 153, 0.4);
        }

        /* Wheel Conic Gradient (52% ЛОХ / 48% ПАЦАН)
           360 deg * 0.52 = 187.2 deg
        */
        #wheel {
            transition: transform 4.5s cubic-bezier(0.15, 0.85, 0.35, 1.02);
            background: conic-gradient(
                #ef4444 0deg 187.2deg,  /* ЛОХ (Красный) - 52% */
                #22c55e 187.2deg 360deg /* ПАЦАН (Зелёный) - 48% */
            );
        }

        /* Pointer Animation */
        @keyframes pointerPulse {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(5px); }
        }

        .pointer-arrow {
            animation: pointerPulse 0.7s infinite ease-in-out;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.8));
        }

        /* Confetti Overlay */
        #confettiCanvas {
            pointer-events: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 50;
        }

        /* Result Card styling */
        .result-card {
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(16px);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center p-4 overflow-x-hidden select-none">

    <!-- Confetti Overlay -->
    <canvas id="confettiCanvas"></canvas>

    <!-- Header Section -->
    <header class="text-center mt-3 mb-2 z-10">
        <div class="inline-block px-3 py-1 bg-amber-500/10 rounded-full border border-amber-500/30 text-amber-300 text-xs font-bold tracking-widest uppercase mb-2">
            NFC Prank Roulette ⚡
        </div>
        <h1 class="text-3xl sm:text-5xl font-black uppercase tracking-wider neon-text-title text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-pink-500 to-emerald-400">
            КТО ТЫ СЕГОДНЯ?
        </h1>
        <p class="text-slate-400 text-xs sm:text-sm mt-1 font-medium">Испытай свою удачу прямо сейчас!</p>
    </header>

    <!-- Main Roulette Section -->
    <main class="flex flex-col items-center justify-center my-auto w-full max-w-sm relative z-10">
        
        <!-- Pointer Arrow -->
        <div class="pointer-arrow absolute -top-5 left-1/2 z-30 text-amber-400 text-4xl sm:text-5xl">
            <i class="fa-solid fa-caret-down"></i>
        </div>

        <!-- Outer Wheel Frame -->
        <div class="neon-glow relative w-72 h-72 sm:w-80 sm:h-80 rounded-full border-8 border-slate-800 p-2 bg-slate-900">
            
            <!-- Rotating Wheel -->
            <div id="wheel" class="w-full h-full rounded-full relative overflow-hidden shadow-inner">
                
                <!-- Sector 1: ЛОХ (52%) -->
                <div class="absolute inset-0 flex items-center justify-center text-white font-black text-2xl uppercase tracking-wider"
                     style="transform: rotate(93.6deg) translateY(-35%); text-shadow: 0 2px 8px rgba(0,0,0,0.8);">
                     <span class="flex items-center gap-1.5"><i class="fa-solid fa-face-frown text-2xl"></i> ЛОХ</span>
                </div>

                <!-- Sector 2: ПАЦАН (48%) -->
                <div class="absolute inset-0 flex items-center justify-center text-white font-black text-2xl uppercase tracking-wider"
                     style="transform: rotate(273.6deg) translateY(-35%); text-shadow: 0 2px 8px rgba(0,0,0,0.8);">
                     <span class="flex items-center gap-1.5"><i class="fa-solid fa-glasses text-2xl"></i> ПАЦАН</span>
                </div>

            </div>

            <!-- Center Wheel Cap -->
            <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-16 h-16 sm:w-20 sm:h-20 bg-slate-950 border-4 border-amber-400 rounded-full flex items-center justify-center shadow-2xl z-20">
                <i class="fa-solid fa-dice text-amber-400 text-2xl sm:text-3xl animate-pulse"></i>
            </div>
        </div>

        <!-- Probability Breakdown Bar -->
        <div class="w-full bg-slate-900/90 rounded-2xl p-3.5 mt-6 border border-slate-800 flex justify-around text-xs text-center font-bold shadow-lg">
            <div class="text-red-400">
                <div class="opacity-80">Сектор 1</div>
                <div class="text-base font-black">ЛОХ (52%)</div>
            </div>
            <div class="w-px bg-slate-800"></div>
            <div class="text-emerald-400">
                <div class="opacity-80">Сектор 2</div>
                <div class="text-base font-black">ПАЦАН (48%)</div>
            </div>
        </div>

        <!-- Spin Action Button -->
        <button id="spinBtn" onclick="spin()" 
                class="w-full mt-5 py-4 px-6 bg-gradient-to-r from-amber-400 via-pink-500 to-emerald-500 hover:from-amber-300 hover:to-emerald-400 text-slate-950 font-black text-xl rounded-2xl shadow-lg shadow-pink-500/20 active:scale-95 transition-all transform flex items-center justify-center gap-3">
            <i class="fa-solid fa-rotate-right text-2xl"></i>
            <span id="btnText">КРУТИТЬ РУЛЕТКУ!</span>
        </button>
    </main>

    <!-- Footer -->
    <footer class="text-center text-xs text-slate-500 mb-2 z-10">
        NFC Prank Roulette • GitHub Pages
    </footer>

    <!-- Result Modal -->
    <div id="resultModal" class="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-300">
        <div class="result-card bg-slate-900 border-2 border-slate-700 rounded-3xl p-6 max-w-xs w-full text-center transform scale-95 transition-transform duration-300">
            
            <div id="resultBadge" class="inline-block px-4 py-1.5 rounded-full text-xs font-black uppercase tracking-wider mb-3">
                Результат
            </div>

            <h2 id="resultTitle" class="text-3xl font-black mb-2 uppercase tracking-wide">
                ---
            </h2>

            <!-- Meme Media Box -->
            <div class="my-4 rounded-2xl overflow-hidden border-2 border-slate-800 bg-black flex items-center justify-center min-h-[160px] max-h-[220px]">
                <img id="resultImage" src="" alt="Meme Result" class="w-full h-full object-cover">
            </div>

            <p id="resultDesc" class="text-slate-300 text-sm font-medium mb-6">
                ---
            </p>

            <button onclick="closeModal()" 
                    class="w-full py-3.5 bg-slate-800 hover:bg-slate-700 text-white font-bold rounded-xl transition-all border border-slate-600 active:scale-95 flex items-center justify-center gap-2">
                <i class="fa-solid fa-redo"></i>
                <span>КРУТИТЬ ЕЩЁ РАЗ</span>
            </button>
        </div>
    </div>

    <!-- Logic Script -->
    <script>
        let isSpinning = false;
        let currentRotation = 0;
        let audioCtx = null;

        // Web Audio API Sound Generator (No external MP3 files required)
        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Click / Tick Sound on Rotation
        function playTickSound() {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(120, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.04);

                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.04);
            } catch (e) {}
        }

        // Victory / Meme Sound Fanfare
        function playWinSound(isLoh) {
            if (!audioCtx) return;
            try {
                const now = audioCtx.currentTime;
                
                if (isLoh) {
                    // Sad / Funny Melodic Descend for ЛОХ
                    [220, 207.65, 196, 185].forEach((freq, idx) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.12);
                        gain.gain.setValueAtTime(0.2, now + idx * 0.12);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.12 + 0.25);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(now + idx * 0.12);
                        osc.stop(now + idx * 0.12 + 0.25);
                    });
                } else {
                    // Upbeat Fanfare for ПАЦАН
                    [261.63, 329.63, 392, 523.25].forEach((freq, idx) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.1);
                        gain.gain.setValueAtTime(0.25, now + idx * 0.1);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.1 + 0.3);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(now + idx * 0.1);
                        osc.stop(now + idx * 0.1 + 0.3);
                    });
                }
            } catch (e) {}
        }

        // Meme Data Configuration
        const MEMES = {
            loh: {
                title: "ТЫ — ЛОХ! 🤡",
                badgeClass: "bg-red-500/20 text-red-400 border border-red-500/40",
                titleColor: "text-red-500",
                desc: "Без обид, но рулетка не врёт! 52% шанса сделали своё дело.",
                image: "https://media.tenor.com/images/80517fa2b6e1b6f007bc46777b7527fa/tenor.gif"
            },
            pacan: {
                title: "ТЫ — ПАЦАН! 😎",
                badgeClass: "bg-emerald-500/20 text-emerald-400 border border-emerald-500/40",
                titleColor: "text-emerald-400",
                desc: "Достойный результат! Пацаны одобрили, уважение поднялось.",
                image: "https://media.tenor.com/m/Zf2IuYk2B4AAAAAC/sigma-male-cat.gif"
            }
        };

        // Main Spin Logic
        function spin() {
            if (isSpinning) return;
            initAudio();

            isSpinning = true;
            const btn = document.getElementById('spinBtn');
            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');

            // Exact random choice (0 to 100)
            const rand = Math.random() * 100;
            let resultType = '';
            let targetOffsetAngle = 0; // Target angle under top pointer (270 deg)

            if (rand < 52) {
                // 52% Chance: ЛОХ (Sector range in wheel: 0 to 187.2 deg)
                resultType = 'loh';
                targetOffsetAngle = Math.floor(Math.random() * 165) + 10;
            } else {
                // 48% Chance: ПАЦАН (Sector range in wheel: 187.2 to 360 deg)
                resultType = 'pacan';
                targetOffsetAngle = Math.floor(Math.random() * 155) + 195;
            }

            // Calculate rotation angle (5 full 360deg spins + offset adjustment)
            const fullSpins = 360 * 5;
            const finalAngle = fullSpins + (360 - targetOffsetAngle);
            currentRotation += finalAngle;

            const wheel = document.getElementById('wheel');
            wheel.style.transform = `rotate(${currentRotation}deg)`;

            // Sound tick interval while wheel spins
            let tickCount = 0;
            const tickInterval = setInterval(() => {
                playTickSound();
                tickCount++;
                if (tickCount > 22) clearInterval(tickInterval);
            }, 180);

            // Wheel stops after 4.5s
            setTimeout(() => {
                clearInterval(tickInterval);
                showResult(resultType);
                isSpinning = false;
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
            }, 4500);
        }

        // Show Result Modal with Meme and Confetti
        function showResult(type) {
            const data = MEMES[type];
            const modal = document.getElementById('resultModal');
            const badge = document.getElementById('resultBadge');
            const title = document.getElementById('resultTitle');
            const desc = document.getElementById('resultDesc');
            const img = document.getElementById('resultImage');

            badge.className = `inline-block px-4 py-1.5 rounded-full text-xs font-black uppercase tracking-wider mb-3 ${data.badgeClass}`;
            title.className = `text-3xl font-black mb-2 uppercase tracking-wide ${data.titleColor}`;
            title.innerText = data.title;
            desc.innerText = data.desc;
            img.src = data.image;

            playWinSound(type === 'loh');
            launchConfetti(type === 'pacan');

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modal.querySelector('.result-card').classList.remove('scale-95');
                modal.querySelector('.result-card').classList.add('scale-100');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('resultModal');
            modal.classList.add('opacity-0');
            modal.querySelector('.result-card').classList.remove('scale-100');
            modal.querySelector('.result-card').classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        // Canvas Confetti / Fireworks
        function launchConfetti(isWin) {
            const canvas = document.getElementById('confettiCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            const colors = isWin 
                ? ['#22c55e', '#3b82f6', '#eab308', '#ffffff'] 
                : ['#ef4444', '#f97316', '#a855f7'];

            for (let i = 0; i < 70; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 12,
                    vy: (Math.random() - 0.5) * 12 - 3,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    size: Math.random() * 7 + 4,
                    life: 90
                });
            }

            function animateConfetti() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let alive = false;

                particles.forEach(p => {
                    if (p.life > 0) {
                        alive = true;
                        p.x += p.vx;
                        p.y += p.vy;
                        p.vy += 0.22; // gravity
                        p.life--;

                        ctx.fillStyle = p.color;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fill();
                    }
                });

                if (alive) requestAnimationFrame(animateConfetti);
            }

            animateConfetti();
        }
