<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кто ты сегодня?</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #111116;
            color: #ffffff;
            font-family: 'Arial Black', Impact, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            overflow: hidden;
            user-select: none;
            padding: 10px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 25px;
            color: #ffcc00;
            text-shadow: 0 0 15px rgba(255, 204, 0, 0.6);
        }

        /* Контейнер рулетки */
        .roulette-box {
            position: relative;
            width: 300px;
            height: 300px;
        }

        /* Указатель стрелки сверху */
        .pointer {
            position: absolute;
            top: -16px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 16px solid transparent;
            border-right: 16px solid transparent;
            border-top: 28px solid #ff0055;
            z-index: 10;
            filter: drop-shadow(0 0 8px #ff0055);
        }

        /* Колесо рулетки */
        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 6px solid #ffffff;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.2);
            /* Градиент 52% (ЛОХ) на 48% (ПАЦАН) */
            background: conic-gradient(
                #ff2a55 0deg 187.2deg,  /* 52% */
                #00e676 187.2deg 360deg /* 48% */
            );
            transition: transform 4s cubic-bezier(0.15, 0.85, 0.35, 1.02);
            position: relative;
        }

        /* Выравнивание текста ровно внутри секторов */
        .sector-text {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.6rem;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
            pointer-events: none;
        }

        /* Точный разворот и позиция первого сектора (ЛОХ) */
        .text-loh {
            transform: rotate(93.6deg) translateY(75px);
        }

        /* Точный разворот и позиция второго сектора (ПАЦАН) */
        .text-pacan {
            transform: rotate(273.6deg) translateY(75px);
        }

        .spin-btn {
            margin-top: 30px;
            padding: 14px 34px;
            font-size: 1.3rem;
            font-weight: bold;
            color: #111;
            background-color: #ffcc00;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.5);
            transition: transform 0.2s;
        }
        .spin-btn:active {
            transform: scale(0.95);
        }

        .result-text {
            margin-top: 20px;
            font-size: 2.2rem;
            min-height: 50px;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
        }
    </style>
</head>
<body>

    <h1>КТО ТЫ СЕГОДНЯ? 🎰</h1>

    <div class="roulette-box">
        <div class="pointer"></div>
        <div class="wheel" id="wheel">
            <div class="sector-text text-loh">ЛОХ</div>
            <div class="sector-text text-pacan">ПАЦАН</div>
        </div>
    </div>

    <div class="result-text" id="result"></div>
    <button class="spin-btn" id="spinBtn" onclick="spin()">КРУТИТЬ!</button>

    <script>
        let isSpinning = false;

        function spin() {
            if (isSpinning) return;
            isSpinning = true;

            const wheel = document.getElementById('wheel');
            const result = document.getElementById('result');
            const btn = document.getElementById('spinBtn');
            result.innerText = '';
            btn.style.display = 'none';

            // Генерация вероятности: 52% (ЛОХ), 48% (ПАЦАН)
            const random = Math.random() * 100;
            let targetDegree = 0;
            let finalResult = '';

            if (random < 52) {
                // Выпадает "ЛОХ" (сектор от 0° до 187.2°)
                targetDegree = 360 * 5 + (187.2 - (Math.floor(Math.random() * 160) + 12)); 
                finalResult = 'ТЫ — ЛОХ! 🤡';
            } else {
                // Выпадает "ПАЦАН" (сектор от 187.2° до 360°)
                targetDegree = 360 * 5 + (360 - (Math.floor(Math.random() * 145) + 12));
                finalResult = 'ТЫ — ПАЦАН! 😎';
            }

            wheel.style.transform = `rotate(${targetDegree}deg)`;

            setTimeout(() => {
                result.innerText = finalResult;
                isSpinning = false;
                btn.innerText = 'ЕЩЁ РАЗ';
                btn.style.display = 'inline-block';
            }, 4000);
        }

        // Автозапуск вращения при открытии
        window.onload = function() {
            setTimeout(spin, 400);
        };
    </script>
</body>
</html>
