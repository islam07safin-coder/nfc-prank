<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFC Prank</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: sans-serif;
            text-align: center;
            user-select: none;
        }
        img {
            max-width: 90%;
            max-height: 70vh;
            border-radius: 12px;
        }
        .hint {
            margin-top: 20px;
            font-size: 18px;
            color: #aaa;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }
    </style>
</head>
<body>

    <!-- Анимированная гифка смеющегося кота -->
    <img src="https://media.tenor.com/images/80517fa2b6e1b6f007bc46777b7527fa/tenor.gif" alt="Laughing Cat">

    <div class="hint">Нажми на экран! 🔊</div>

    <!-- Звук смеха кота -->
    <audio id="catLaugh" loop preload="auto">
        <source src="https://www.myinstants.com/media/sounds/laughing-cat.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Функция включения звука по касанию
        function playAudio() {
            var audio = document.getElementById('catLaugh');
            audio.play().then(() => {
                document.querySelector('.hint').style.display = 'none';
            }).catch(err => console.log(err));
        }

        // Запуск звука при клике или касании экрана
        document.body.addEventListener('click', playAudio);
        document.body.addEventListener('touchstart', playAudio);
    </script>
</body>
</html>
